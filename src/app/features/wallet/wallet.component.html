<header class="page-header">
  <h1>Carteira</h1>
</header>

<section class="session-wallets">
  @for (wallet of Wallets; track wallet.uuid) {
    <article class="wallet-card">

      <h2>{{ wallet.name }}</h2>

      <p>{{ wallet.description }}</p>

      <span class="wallet-balance">
        R$ {{ wallet.currentBalance }}
      </span>

    </article>
  }
</section>
